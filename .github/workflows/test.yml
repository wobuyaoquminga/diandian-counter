name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  store-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check app.js
      - run: node --check persistence.js
      - run: node --test store.test.js
